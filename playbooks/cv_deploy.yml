---
- name: Configuration deployment
  hosts: "{{ lookup('ansible.builtin.env', 'FABRIC_INVENTORY_GROUP', default='FABRIC') }}"
  connection: local
  gather_facts: false
  tasks:
    - name: Deploy configurations and tags to CloudVision
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
      vars:
        cv_server: "{{ lookup('ansible.builtin.env', 'CV_DEPLOY_SERVER', default=lookup('ansible.builtin.env', 'TELEMETRY_PRODUCTION_SERVERS') | split(',') | first) }}"
        cv_token: "{{ lookup('ansible.builtin.env', 'CV_DEPLOY_TOKEN') }}"
        cv_verify_certs: "{{ lookup('ansible.builtin.env', 'CV_VERIFY_CERTS', default=false) | bool }}"
        cv_submit_workspace: "{{ lookup('ansible.builtin.env', 'SUBMIT_WORKSPACE', default=true) | bool }}"
        cv_run_change_control: "{{ lookup('ansible.builtin.env', 'RUN_CHANGE_CONTROL', default=false) | bool }}"
        cv_workspace_name: "{{ lookup('ansible.builtin.env', 'WORKSPACE_NAME') }}"
        cv_workspace_description: "{{ lookup('ansible.builtin.env', 'WORKSPACE_DESCRIPTION', default=arista.avd.default) }}"
        cv_change_control_description: "{{ lookup('ansible.builtin.env', 'CHANGE_CONTROL_DESCRIPTION', default=arista.avd.default) }}"
