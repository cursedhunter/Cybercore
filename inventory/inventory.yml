---
all:
  children:
    FABRIC:
      vars:
        mgmt_interface_vrf: MGMT
        mgmt_interface: Management1
        mgmt_ip: "{{ mgmt_ip_pool[inventory_hostname] | mandatory(msg='Host does not have a mgmt_ip defined inside inventory/group_vars/FABRIC/mgmt_ip_pool.yml') }}"
        mgmt_gateway: "{{ mgmt_ip | ansible.utils.ipaddr('network/prefix') | ansible.utils.ipaddr('254') | ansible.utils.ipaddr('address') }}"
      children:
        MGMT_FABRIC:
          children:
            MGMT_LEAFS:
              children:
                MGMT_POD1_LEAFS:
                  hosts:
                    mp01l01:
                      is_deployed: false
        SPINES:
          children:
            PLANE1_SPINES:
              hosts:
                p01s01:
                  is_deployed: false
                p01s02:
                  is_deployed: false
        LEAFS:
          children:
            POD1_LEAFS:
              hosts:
                p01l01a:
                  is_deployed: false
                p01l01b:
                  is_deployed: false
                p01l03:
                  is_deployed: false
                p01l04:
                  is_deployed: false
    OVERLAY:
      children:
        MGMT_POD1_LEAFS:
        POD1_LEAFS:
    NETWORK_PORTS:
      children:
        MGMT_POD1_LEAFS:
        POD1_LEAFS:
