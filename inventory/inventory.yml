---
all:
  children:
    CV:
      hosts:
        cvp:
          ansible_host: "{{ lookup('ansible.builtin.env', 'CV_SERVERS') | split(',') | first }}"
          ansible_password: "{{ lookup('ansible.builtin.env', 'CV_TOKEN') }}"

    FABRIC:
      vars:
        mgmt_interface_vrf: MGMT
        mgmt_interface: Management1
        mgmt_ip: "{{ mgmt_ip_pool[inventory_hostname] | mandatory(msg='Host does not have a mgmt_ip defined inside inventory/group_vars/FABRIC/mgmt_ip_pool.yml') }}"
        mgmt_gateway: "{{ mgmt_ip | ansible.utils.ipaddr('network/prefix') | ansible.utils.ipaddr('1') | ansible.utils.ipaddr('address') }}"
      children:
        MGMT_FABRIC:
          children:
            MGMT_SUPER_SPINES:
              children:
                MGMT_PLANE1_SUPER_SPINES:
                  hosts:
                    mx01u[01:04]:
            MGMT_SPINES:
              children:
                MGMT_PLANE1_SPINES:
                  hosts:
                    mp[01:16]s[01:02]:
            MGMT_LEAFS:
              children:
