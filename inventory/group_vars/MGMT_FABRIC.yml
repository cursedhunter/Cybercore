---
default_interfaces:
  # DCS-7050CX3-32S-F
  - types:
      - super-spine
    platforms:
      - "7050"
    downlink_interfaces:
      - Ethernet1-32/1

  # DCS-7280SR3-48YC8-F
  - types:
      - spine
    platforms:
      - "7280"
    uplink_interfaces:
      - Ethernet49-56/1
    downlink_interfaces:
      - Ethernet1-48/1

  # DCS-7010TX-48C-F
  - types:
      - l3leaf
    platforms:
      - "7010TX"
    uplink_interfaces:
      - Ethernet49-52/1
    downlink_interfaces:
      - Ethernet1-48/1

custom_platform_settings:
  - platforms:
      - 7010TX
    feature_support:
      per_interface_mtu: false
    reload_delay:
      mlag: 300
      non_mlag: 330
    default_interface_mtu: 9214
    structured_config:
      sflow:
        sample: 2048
        polling_interval: 30
        destinations:
          - destination: 127.0.0.1
        source_interface: Loopback0
        run: true
      queue_monitor_length:
        enabled: true
      queue_monitor_streaming:
        enable: true
        vrf: MGMT
    raw_eos_cli: |
      service unsupported-transceiver Meadowgate_Lab b85d0a8
      username admin privilege 15 role network-admin secret sha512 $6$9cdTWrsp/CClMCVh$xvhQaNtGc1paGEo2OW9n.n45/0RMR3iKng938j65uSdEf/sLI0CpqEKQViUV0K/U1KDWFJfPlgIsZ9Cv77fbD.
      username cvpadmin privilege 15 secret sha512 $6$Cpdy2nld0AowmaVa$Nf4jJx0/3BeyDpIqRzRUOxw3aJuDmwPTAsEUnFc/qw/C57CNllV5GVCVYnpcQokWY1MLtWFLnAiBVZB.bcjcp1
      daemon TerminAttr
        exec /usr/bin/TerminAttr -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -cvaddr=10.65.8.209:9910,10.65.8.210:9910,10.65.8.211:9910 -cvauth=token,/tmp/token -cvvrf=IP_FABRIC -cvsourceintf=Vlan10 -taillogs
        no shutdown
