---
l3leaf: # dynamic_key: node_type
  defaults:
    mgmt_ip: "{{ mgmt_ip }}"
    evpn_route_servers:
      - p01l01a
      - p01l01b
    bgp_as: "{{ asn_mgmt_pod1_leafs }}" # 651010-651015
    loopback_ipv4_pool: "{{ mgmt_pod1_leaf_loopback_ipv4_pool }}" # 10.0.11.0/24
    platform: "7010TX"
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
    uplink_ipv4_pool: "{{ mgmt_pod1_leaf_uplink_ipv4_pool }}" # 10.67.101.0/24
    uplink_switches:
      - p01l01a
      - p01l01b
    uplink_switch_interfaces:
      - Ethernet28/1
      - Ethernet28/2
      - Ethernet28/3
      - Ethernet28/4
    uplink_interfaces:
      - Ethernet49
      - Ethernet50
    virtual_router_mac_address: 00:1c:73:00:dc:01
    vtep_loopback_ipv4_pool: "{{mgmt_pod1_leaf_vtep_loopback_ipv4_pool}}" # 10.68.101.0/24
  node_groups:
    - filter:
        tags:
          - OVERLAY_MGMT_VXLAN
      group: RACK1
      nodes:
        - id: 1
          name: mp01l01
