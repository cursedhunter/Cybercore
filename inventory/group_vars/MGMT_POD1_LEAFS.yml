---

l3leaf: # dynamic_key: node_type
  defaults:
    uplink_ethernet_structured_config:
      service_profile: "PF_FABRIC_QUEUES_7010"
    structured_config:
      qos_profiles:
        - name: PF_PM_CLASSIFY_7010 # 7010s
          service_policy:
            type:
              qos_input: "PM_CLASSIFY"
          tx_queues: # tx_queue on 7280's
            - id: 5
              # bandwidth_guaranteed_percent: 95
              shape:
                rate: "25000000 kbps"
              comment: "5 percent of 250G for #7 traffic, mgmt"
            - id: 7
              # bandwidth_guaranteed_percent: 5
              shape:
                rate: "5 percent"
              comment: "85 percent of 250G for #5 traffic, production"
        - name: PF_FABRIC_QUEUES_7010
          trust: "dscp"
    mgmt_ip: "{{ mgmt_ip }}"
    evpn_route_servers:
      - p01l01a
      - p01l01b
    bgp_as: "{{ asn_mgmt_pod1_leafs }}" # 651010-651015
    loopback_ipv4_pool: "{{ mgmt_pod1_leaf_loopback_ipv4_pool }}" # 10.0.11.0/24
    platform: "7010TX"
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
    uplink_ipv4_pool: "{{ mgmt_pod1_leaf_uplink_ipv4_pool }}" # 10.67.101.0/24
    uplink_switches:
      - p01l01a
      - p01l01b
    uplink_switch_interfaces:
      - Ethernet28/1
      - Ethernet28/1
    uplink_interfaces:
      - Ethernet49
      - Ethernet50
    uplink_interface_speed: "25g"
    virtual_router_mac_address: 00:1c:73:00:dc:01
    vtep_loopback_ipv4_pool: "{{ mgmt_pod1_leaf_vtep_loopback_ipv4_pool }}" # 10.68.101.0/24
  node_groups:
    - filter:
        tags:
          - OVERLAY_MGMT_VXLAN
          - OVERLAY_C2M2_VXLAN
      group: RACK1
      nodes:
        - id: 1
          name: mp01l01
