---

# overlay controllers
type: overlay-controller

mgmt_interface: Management1/1

overlay_controller: # dynamic_key: node_type
  defaults:
    mgmt_ip: "{{ mgmt_ip }}"
    platform: vEOS-lab
    loopback_ipv4_pool: 172.120.1.0/24
    bgp_as: 65120.1
    uplink_ipv4_pool: 10.120.0.0/20
    evpn_role: server
  nodes:
    - id: 1
      name: x01c01
      uplink_switches:
        - x01u01
        - x01u02
        - x01u03
        - x01u04
        - x01u05
        - x01u06
      uplink_switch_interfaces:
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
    - id: 2
      name: x02c01
      uplink_switches:
        - x02u01
        - x02u02
        - x02u03
        - x02u04
        - x02u05
        - x02u06
      uplink_switch_interfaces:
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
    - id: 3
      name: x03c01
      uplink_switches:
        - x03u01
        - x03u02
        - x03u03
        - x03u04
        - x03u05
        - x03u06
      uplink_switch_interfaces:
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
    - id: 4
      name: x04c01
      uplink_switches:
        - x04u01
        - x04u02
        - x04u03
        - x04u04
        - x04u05
        - x04u06
      uplink_switch_interfaces:
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
        - Ethernet65/1
