mgmt_interface: Management1
mgmt_interface_description: mgmt-interface
mgmt_interface_vrf: MGMT
mgmt_gateway: 100.64.0.6

p2p_uplinks_mtu: "{{ lookup('ansible.builtin.env', 'MAX_SUPPORTED_MTU', default=9214) }}"

# Cloud Vision server information
cvp_token_file: "{{ lookup('ansible.builtin.env', 'TELEMETRY_TOKEN_PATH', default='/tmp/token') }}"
cvp_instance_ips: "{{ lookup('ansible.builtin.env', 'TELEMETRY_SERVERS') | split(',') }}"

name_servers:
  - 10.255.0.2
  - 8.8.8.8

# FIXME: remove this line

custom_structured_configuration_dns_domain: xl.aristanetworks.com

custom_structured_configuration_prefix: [ custom_structured_configuration_, bgp_overrides_ ]
bgp_overrides_router_bgp:
  as_notation: asdot

custom_structured_configuration_interface_defaults:
  ethernet:
    shutdown: true


# NTP Servers IP or DNS name, first NTP server will be preferred, and sourced from Management VRF
ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: 0.pool.ntp.org
    - name: 1.pool.ntp.org


evpn_ebgp_multihop: 8

underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

# Optional, enable multicast features
# underlay_multicast: true
# evpn_multicast: true
service_routing_protocols_model: multi-agent

bgp_peer_groups:
