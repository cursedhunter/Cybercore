---

fabric_name: FABRIC
dc_name: dc1

generate_cv_tags:
  topology_hints: true

node_type_keys:
  - key: spine
    type: spine
    default_ptp_priority1: 20

  - key: l3leaf
    type: l3leaf
    connected_endpoints: true
    default_evpn_role: client
    cv_tags_topology_type: leaf
    default_ptp_priority1: 30
    mlag_support: true
    network_services:
      l2: true
      l3: true
    vtep: true

  - key: super_spine
    type: super-spine
    default_evpn_role: none

  - key: overlay_controller
    type: overlay-controller
    default_evpn_role: server

default_interfaces:
  - types:
      - overlay-controller
    platforms:
      - vEOS-lab
    uplink_interfaces:
      - Ethernet1-6/1
  - types:
      - super-spine
    platforms:
      - vEOS-lab
    downlink_interfaces:
      - Ethernet1-65/1

  - types:
      - spine
    platforms:
      - vEOS-lab
    uplink_interfaces:
      - Ethernet39-64/1
    downlink_interfaces:
      - Ethernet1-38/1

  - types:
      - l3leaf
    platforms:
      - 7050DX4
    uplink_interfaces:
      - Ethernet31-32/1
    mlag_interfaces:
      - Ethernet29-30/1
    downlink_interfaces:
      - Ethernet1-27/1

aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      sha512_password: "$6$37IFaF.OwMryVaHN$jhP4nbvc9EQcFxsmUsLoNvoxs3Bo5ZAjCPt2zuLbJ0OWH4ovtOA/oUCr8SOurRZzOGY5RD37ZNgTqzyaKGEdo/"
    - name: cvpadmin
      privilege: 15
      role: network-admin
      sha512_password: "$6$YjSaCDBDfksJhHe/$uEDYNNzuQHWcliy/HUFha/tANrAgGl5pLJs3MMqPlJrLfWaD4368NOpbcpH5or/TEGn32byx0hZUl6yEiX26R/"

mgmt_interface: Management1
mgmt_interface_description: mgmt-interface
mgmt_interface_vrf: MGMT

management_eapi:
  enabled: true
  enable_http: true
  enable_https: true
  vrfs:
    - name: MGMT
      enabled: true

p2p_uplinks_mtu: "{{ lookup('ansible.builtin.env', 'MAX_SUPPORTED_MTU', default=9214) }}"

cv_settings:
  onprem_clusters:
    - name: cv
      servers: "{{ lookup('ansible.builtin.env', 'TELEMETRY_SERVERS') | split(',') | map('community.general.dict_kv', 'name') }}"
      token_file: "{{ lookup('ansible.builtin.env', 'TELEMETRY_TOKEN_PATH', default='/tmp/token') }}"

dns_settings:
  domain: lab.graingerdock4.com
  servers:
    - ip_address: 8.8.8.8
    - ip_address: 10.65.1.110

custom_structured_configuration_prefix: [custom_structured_configuration_, bgp_overrides_]
bgp_overrides_router_bgp:
  as_notation: asplain

custom_structured_configuration_interface_defaults:
  ethernet:
    shutdown: true
  mtu: "{{ lookup('ansible.builtin.env', 'MAX_SUPPORTED_MTU', default=9214) }}"

# NTP Servers IP or DNS name, first NTP server will be preferred, and sourced from Management VRF
ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: 10.65.6.108
      iburst: true
    - name: 10.65.6.120
      iburst: true

evpn_ebgp_multihop: 8

underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

# Optional, enable multicast features
# underlay_multicast: true
# evpn_multicast: true
# service_routing_protocols_model: multi-agent

bgp_peer_groups:
  ipv4_underlay_peers:
    password: "AQQvKeimxJu+uGQ/yYvv9w=="
  evpn_overlay_peers:
    password: "q+VNViP5i4rVjW1cxFv2wA=="
  mlag_ipv4_underlay_peer:
    password: "vnEaG8gMeQf3d3cN6PktXQ=="

#### Override for vEOS Lab Caveats ####

# Adjust default bfd values
bfd_multihop:
  interval: 1200
  min_rx: 1200
  multiplier: 3

shutdown_bgp_towards_undeployed_peers: true
shutdown_interfaces_towards_undeployed_peers: true

platform_settings:
  - platforms: ["7050DX4"]
    reload_delay:
      mlag: 300
      non_mlag: 330
    structured_config:
      sflow:
        sample: 2048
        polling_interval: 30
        destinations:
          - destination: 127.0.0.1
        source_interface: Loopback0
        run: true
      queue_monitor_length:
        enabled: true
      queue_monitor_streaming:
        enable: true
        vrf: MGMT
    raw_eos_cli: |
      service unsupported-transceiver Meadowgate_Lab b85d0a8
      ip hardware fib load-balance distribution dynamic
      ip hardware fib load-balance distribution dynamic inactivity-threshold 60 microseconds
      ip hardware fib load-balance distribution dynamic sampling-period 10 microseconds
      ip hardware fib load-balance distribution dynamic average-traffic-weight 10
      ip hardware fib load-balance distribution dynamic seed 100
      ip hardware fib load-balance distribution dynamic flow-set-size 3
      service unsupported-transceiver Meadowgate_Lab b85d0a8
  - platforms: ["7060"]
    reload_delay:
      mlag: 300
      non_mlag: 330
    structured_config:
      sflow:
        sample: 2048
        polling_interval: 30
        destinations:
          - destination: 127.0.0.1
        source_interface: Loopback0
        run: true
      queue_monitor_length:
        enabled: true
      queue_monitor_streaming:
        enable: true
        vrf: MGMT
    raw_eos_cli: |
      service unsupported-transceiver Meadowgate_Lab b85d0a8
      ip hardware fib load-balance distribution dynamic
      ip hardware fib load-balance distribution dynamic inactivity-threshold 60 microseconds
      ip hardware fib load-balance distribution dynamic sampling-period 10 microseconds
      ip hardware fib load-balance distribution dynamic average-traffic-weight 10
      ip hardware fib load-balance distribution dynamic seed 100
      ip hardware fib load-balance distribution dynamic flow-set-size 3
      service unsupported-transceiver Meadowgate_Lab b85d0a8
  - platforms: ["7060CX2"]
    reload_delay:
      mlag: 300
      non_mlag: 330
    structured_config:
      sflow:
        sample: 1048
        polling_interval: 30
        destinations:
          - destination: 127.0.0.1
        source_interface: Loopback0
        run: true
      queue_monitor_length:
        enabled: true
      queue_monitor_streaming:
        enable: true
        vrf: MGMT
    raw_eos_cli: |
      service unsupported-transceiver Meadowgate_Lab b85d0a8
      interface Recirc-Channel1
        switchport mode trunk
        switchport recirculation features vxlan
      interface Et9/1-18/1
        description "Recirculation Ports"
        no shutdown
        traffic-loopback source system device mac
        channel-group recirculation 1

custom_structured_configuration_standard_access_lists:
  - name: CP-PROTECT
    counters_per_entry: false
    sequence_numbers:
      - sequence: 10
        action: permit 10.65.0.0/24
      - sequence: 20
        action: permit 10.65.1.0/24
      - sequence: 30
        action: permit 10.70.1.38/32

custom_structured_configuration_ip_access_lists:
  # - name: ACL_CONTROL_PLANE
  #   counters_per_entry: false
  #   entries:
  #     - sequence: 10
  #       # remark "BGP"
  #       action: "permit"
  #       protocol: "tcp"
  #       source: "any"
  #       destination: "any"
  #       destination_ports_match: "eq"
  #       destination_ports: [bgp]
  - name: ACL_PRODUCTION_TRAFFIC
    counters_per_entry: false
    entries:
      - sequence: 10
        # remark "Data Traffic"
        action: "permit"
        protocol: "ip"
        source: "10.64.0.0/16"
        destination: "10.64.0.0/16"
  - name: ACL_METRICS_TRAFFIC
    counters_per_entry: false
    entries:
      - sequence: 10
        # remark "C2M2 Traffic"
        action: "permit"
        protocol: "ip"
        source: "10.65.0.0/16"
        destination: "any"

custom_structured_configuration_class_maps:
  qos:
    - name: CM_MATCH_CP
      ip:
        access_group: ACL_CONTROL_PLANE
    - name: CM_MATCH_PRODUCTION
      ip:
        access_group: ACL_PRODUCTION_TRAFFIC
    - name: CM_MATCH_CP
      ip:
        access_group: ACL_METRICS_TRAFFIC
    # - name: CM_MATCH_COPP
    #   ip:
    #     access_group: ACL_COPP_MGMT

custom_structured_configuration_policy_maps:
  qos:
    - name: PM_CLASSIFY
      classes:
        - name: CM_MATCH_CP
          set:
            traffic_class: 7
            dscp: cs6
        - name: CM_MATCH_PRODUCTION
          set:
            traffic_class: 5
            dscp: af41
        - name: CM_MATCH_METRICS
          set:
            traffic_class: 0

