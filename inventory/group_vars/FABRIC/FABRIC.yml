---

fabric_name: FABRIC
dc_name: dc1

generate_cv_tags:
  topology_hints: true

node_type_keys:
  - key: spine
    type: spine
    default_ptp_priority1: 20

  - key: l3leaf
    type: l3leaf
    connected_endpoints: true
    default_evpn_role: client
    cv_tags_topology_type: leaf
    default_ptp_priority1: 30
    mlag_support: true
    network_services:
      l2: true
      l3: true
    vtep: true

  - key: super_spine
    type: super-spine
    default_evpn_role: none

  - key: overlay_controller
    type: overlay-controller
    default_evpn_role: server

default_interfaces:
  - types:
      - overlay-controller
    platforms:
      - vEOS-lab
    uplink_interfaces:
      - Ethernet1-6/1
  - types:
      - super-spine
    platforms:
      - vEOS-lab
    downlink_interfaces:
      - Ethernet1-65/1

  - types:
      - spine
    platforms:
      - vEOS-lab
    uplink_interfaces:
      - Ethernet39-64/1
    downlink_interfaces:
      - Ethernet1-38/1

  - types:
      - l3leaf
    platforms:
      - 7050DX4
    uplink_interfaces:
      - Ethernet31-32/1
    mlag_interfaces:
      - Ethernet29-30/1
    downlink_interfaces:
      - Ethernet1-27/1

aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      sha512_password: "$6$hpdQay6BcrZvWaw5$wBAFmW/kOk8NAArSekZd1b5G3LafQIVAiOoT22HmatoqEBuaYv8Qp5sBv7S0/P1B.ZDUBc8vebNu0sY1hNEES0"
    - name: cvpadmin
      privilege: 15
      role: network-admin
      sha512_password: "$6$sutaqJ4NpqFd6ee/$X9rBKN.SvANxvJleABn/dDkhGlzP3RHVXzolncWJmxPoGJeaGOn4hA2hWkoYNPVS7kVXJF2RTJgbnG/w7KAMM/"

mgmt_interface: Management1
mgmt_interface_description: mgmt-interface
mgmt_interface_vrf: MGMT

management_eapi:
  enabled: true
  enable_http: true
  enable_https: true
  # vrfs:
  #  - name: MGMT
  #    enabled: true

p2p_uplinks_mtu: "{{ lookup('ansible.builtin.env', 'MAX_SUPPORTED_MTU', default=9214) }}"

cv_settings:
  onprem_clusters:
    - name: cv
      servers: "{{ lookup('ansible.builtin.env', 'TELEMETRY_SERVERS') | split(',') | map('community.general.dict_kv', 'name') }}"
      token_file: "{{ lookup('ansible.builtin.env', 'TELEMETRY_TOKEN_PATH', default='/tmp/token') }}"

dns_settings:
  domain: aristanetworks.com
  servers:
    - ip_address: 8.8.8.8
    - ip_address: 10.65.1.110

custom_structured_configuration_prefix: [custom_structured_configuration_, bgp_overrides_]
bgp_overrides_router_bgp:
  as_notation: asplain

custom_structured_configuration_interface_defaults:
  ethernet:
    shutdown: false
  mtu: "{{ lookup('ansible.builtin.env', 'MAX_SUPPORTED_MTU', default=9214) }}"

# NTP Servers IP or DNS name, first NTP server will be preferred, and sourced from Management VRF
ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: 10.65.6.108
      iburst: true
    - name: 10.65.6.120
      iburst: true

evpn_ebgp_multihop: 8

underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

# Optional, enable multicast features
# underlay_multicast: true
# evpn_multicast: true
# service_routing_protocols_model: multi-agent

bgp_peer_groups:
  ipv4_underlay_peers:
    password: "AQQvKeimxJu+uGQ/yYvv9w=="
  evpn_overlay_peers:
    password: "q+VNViP5i4rVjW1cxFv2wA=="
  mlag_ipv4_underlay_peer:
    password: "vnEaG8gMeQf3d3cN6PktXQ=="

#### Override for vEOS Lab Caveats ####

# Adjust default bfd values
bfd_multihop:
  interval: 1200
  min_rx: 1200
  multiplier: 3

shutdown_bgp_towards_undeployed_peers: false
shutdown_interfaces_towards_undeployed_peers: false

platform_settings:
  - platforms: ["7050DX4"]
    reload_delay:
      mlag: 300
      non_mlag: 330
    structured_config:
      sflow:
        sample: 2048
        polling_interval: 30
        destinations:
          - destination: 127.0.0.1
        source_interface: Loopback0
        run: true
      queue_monitor_length:
        enabled: true
      queue_monitor_streaming:
        enable: true
        vrf: MGMT
    raw_eos_cli: |
      service unsupported-transceiver Meadowgate_Lab b85d0a8
      ip hardware fib load-balance distribution dynamic
      ip hardware fib load-balance distribution dynamic inactivity-threshold 60 microseconds
      ip hardware fib load-balance distribution dynamic sampling-period 10 microseconds
      ip hardware fib load-balance distribution dynamic average-traffic-weight 10
      ip hardware fib load-balance distribution dynamic seed 100
      ip hardware fib load-balance distribution dynamic flow-set-size 3
      service unsupported-transceiver Meadowgate_Lab b85d0a8
      username admin privilege 15 role network-admin secret sha512 $6$9cdTWrsp/CClMCVh$xvhQaNtGc1paGEo2OW9n.n45/0RMR3iKng938j65uSdEf/sLI0CpqEKQViUV0K/U1KDWFJfPlgIsZ9Cv77fbD.
      username cvpadmin privilege 15 secret sha512 $6$Cpdy2nld0AowmaVa$Nf4jJx0/3BeyDpIqRzRUOxw3aJuDmwPTAsEUnFc/qw/C57CNllV5GVCVYnpcQokWY1MLtWFLnAiBVZB.bcjcp1
      daemon TerminAttr
