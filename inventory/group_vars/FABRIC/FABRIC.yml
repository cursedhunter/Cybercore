---

fabric_name: FABRIC

node_type_keys:
  - key: spine
    type: spine
    default_ptp_priority1: 20

  - key: l3leaf
    type: l3leaf
    connected_endpoints: true
    default_evpn_role: client
    default_ptp_priority1: 30
    mlag_support: true
    network_services:
      l2: true
      l3: true
    vtep: true

  #  - key: border_leaf
  #    type: border-leaf
  #    connected_endpoints: true
  #    default_evpn_role: client
  #    default_ptp_priority1: 30
  #    mlag_support: true
  #    network_services:
  #      l2: true
  #      l3: true
  #    vtep: true

  - key: super_spine
    type: super-spine

  - key: overlay_controller
    type: overlay-controller
    default_evpn_role: server

default_interfaces:
  - types:
      - overlay-controller
    platforms:
      - vEOS-lab
    uplink_interfaces:
      - Ethernet1-4/1

  - types:
      - super-spine
    platforms:
      - vEOS-lab
    downlink_interfaces:
      - Ethernet1-65/1

  - types:
      - spine
    platforms:
      - vEOS-lab
    uplink_interfaces:
      - Ethernet39-64/1
    downlink_interfaces:
      - Ethernet1-38/1

  - types:
      - l3leaf
    platforms:
      - vEOS-lab
    uplink_interfaces:
      - Ethernet1-4/1
    mlag_interfaces:
      - Ethernet5-6/1
    downlink_interfaces:
      - Ethernet7-32/1

local_users:
