---

type: l3leaf

custom_structured_configuration_qos_profiles:
  - name: PF_PM_CLASSIFY # for leafs, errors on 7010s and mspines
    service_policy:
      type:
        qos_input: "PM_CLASSIFY"
    uc_tx_queues: # tx_queue on 7280's
      - id: 6
        priority: "priority strict"
        # bandwidth_guaranteed_percent: 95
        shape:
          rate: "5 percent"
      # comment: "5 percent of 250G for #6 traffic, mgmt"
      - id: 5
        bandwidth_guaranteed_percent: 95 # production traffic up to 95% when c2m2 is active
      - id: 0
        bandwidth_percent: 5
        # comment: best effort
    mc_tx_queues: # tx_queue on 7280's
      - id: 6
        priority: "strict"
        # bandwidth_guaranteed_percent: 95
        shape:
          rate: "5 percent"
      # comment: "5 percent of 250G for #6 traffic, mgmt"
      - id: 5
        bandwidth_guaranteed_percent: 95 # production traffic up to 95% when c2m2 is active
      - id: 0
        bandwidth_percent: 5
        # comment: best effort
  - name: PF_FABRIC_QUEUES
    trust: "dscp"
    uc_tx_queues:
      - id: 6
        priority: "strict"
        shape:
          rate: "5 percent"
      - id: 5
        bandwidth_percent: 95
      - id: 0
        bandwidth_percent: 5
