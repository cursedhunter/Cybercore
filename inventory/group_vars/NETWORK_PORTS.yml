      - Ethernet17/1
      - Ethernet18/1
      - Ethernet19/1
      - Ethernet20/1
      - Ethernet21/1
      - Ethernet22/1
      - Ethernet23/1
      - Ethernet24/1
    profile: proxmox-node-trunk-100g-4
    description: "proxmox"
  - switches:
      - p01l01b
    switch_ports:
      - Ethernet17/1
      - Ethernet18/1
      - Ethernet19/1
      - Ethernet20/1
      - Ethernet21/1
      - Ethernet22/1
      - Ethernet23/1
      - Ethernet24/1
    profile: proxmox-node-trunk-100g
