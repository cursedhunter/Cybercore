---

port_profiles:
  - profile: unused
    enabled: false
    mode: access
    # vlans: 666
    # spanning_tree_portfast: edge
    # spanning_tree_bpdufilter: enabled
    # spanning_tree_bpduguard: enabled
    # flowcontrol:
    #   received: "on"
    validate_state: false
    validate_lldp: false

  - profile: outbound
    # speed: "auto 10gfull"
    enabled: true
    mode: access
    vlans: 666
    mtu: 9000
    # spanning_tree_portfast: edge
    # spanning_tree_bpdufilter: enabled
    # spanning_tree_bpduguard: enabled
    # flowcontrol:
    #   received: "on"
    validate_state: false
    validate_lldp: false

  - profile: mgmt-vxlan
    speed: "auto 1gfull"
    enabled: true
    mode: access
    vlans: 10
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: c2m2-vxlan-7010
    # speed: "auto 25gfull"
    enabled: true
    mode: access
    # mtu: 9100
    vlans: 67
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: c2m2-vxlan-single
    speed: "auto 25gfull"
    enabled: true
    mode: access
    mtu: 9100
    vlans: 67
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: c2m2-vxlan-lacp
    speed: "auto 25gfull"
    enabled: true
    mode: access
    mtu: 9100
    vlans: 67
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    port_channel:
      mode: active
      lacp_fallback:
        mode: "individual"
        individual:
          profile: c2m2-vxlan-lacp
    validate_state: false
    validate_lldp: false

  - profile: esxi-node-trunk
    speed: "50g-2"
    enabled: true
    mode: trunk
    mtu: 9100
    # native_vlan: 67
    vlans: 67,100,993-999
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: vsan-node-trunk
    speed: "25g"
    enabled: true
    mode: trunk
    mtu: 9100
    # native_vlan: 67
    vlans: 67,100,993-999
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: proxmox-node-trunk-100g-4
    speed: "auto 100g-4"
    enabled: true
    mode: trunk
    mtu: 9100
    native_vlan: 67
    vlans: 15,67,100,102
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: proxmox-node-trunk-100g
    speed: "100g"
    enabled: true
    mode: trunk
    mtu: 9100
    native_vlan: 67
    vlans: 15,67,100,102
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: general-infrastruture-node-trunk
    speed: "auto 100g-4"
    enabled: true
    mode: trunk
    mtu: 9100
    native_vlan: 67
    vlans: 15,67,100
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    port_channel:
      mode: active
      lacp_fallback:
        mode: "individual"
        individual:
          profile: general-infrastruture-node-trunk
    validate_state: false
    validate_lldp: false

  - profile: dell-mgmt-leaf
    speed: "forced 10000full"
    enabled: true
    mode: access
    mtu: 9214
    vlans: 67
    port_channel:
      mode: active
      lacp_fallback:
        mode: "individual"
        individual:
          profile: dell-mgmt-leaf
    validate_state: false
    validate_lldp: false

  - profile: dell-mgmt-leaf-rack5
    speed: "forced 10000full"
    enabled: true
    mode: access
    mtu: 9214
    vlans: 10
    port_channel:
      mode: active
      lacp_fallback:
        mode: "individual"
        individual:
          profile: dell-mgmt-leaf-rack5
    validate_state: false
    validate_lldp: false

  - profile: zfs-access
    # speed: "forced 10000full"
    enabled: true
    mode: access
    mtu: 9000
    vlans: 100
    validate_state: false
    validate_lldp: false

  - profile: codeword-svi-lacp
    speed: "100g-2"
    enabled: true
    mode: access
    mtu: 9100
    vlans: 100
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    raw_eos_cli: |
      phy link training
    flowcontrol:
      received: "on"
    port_channel:
      mode: active
      lacp_fallback:
        mode: "individual"
        individual:
          profile: codeword-svi-lacp
    validate_state: false
    validate_lldp: false

network_ports:
  - switches:
      - p01l01a
      - p01l01b
    switch_ports:
      - Ethernet4/1
      - Ethernet4/3
      - Ethernet4/5
      - Ethernet4/7
    profile: codeword-svi-lacp
    description: "DELL EDS NIC 1"
  - switches:
      - p01l01a
      - p01l01b
    switch_ports:
      - Ethernet5/1
      - Ethernet5/3
      - Ethernet5/5
      - Ethernet5/7
    profile: codeword-svi-lacp
    description: "DELL EDS NIC 2"
  - switches:
      - p01l01a
      - p01l01b
    switch_ports:
      - Ethernet1/1
      - Ethernet1/3
      - Ethernet1/5
      - Ethernet1/7
    profile: codeword-svi-lacp
