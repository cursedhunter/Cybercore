---

port_profiles:
  - profile: unused
    enabled: false
    mode: access
    # vlans: 666
    # spanning_tree_portfast: edge
    # spanning_tree_bpdufilter: enabled
    # spanning_tree_bpduguard: enabled
    # flowcontrol:
    #   received: "on"
    validate_state: false
    validate_lldp: false

  - profile: outbound
    # speed: "auto 10gfull"
    enabled: true
    mode: access
    vlans: 666
    # spanning_tree_portfast: edge
    # spanning_tree_bpdufilter: enabled
    # spanning_tree_bpduguard: enabled
    # flowcontrol:
    #   received: "on"
    validate_state: false
    validate_lldp: false

  - profile: mgmt-vxlan
    speed: "auto 1gfull"
    enabled: true
    mode: access
    vlans: 10
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: c2m2-vxlan-single
    speed: "auto 25gfull"
    enabled: true
    mode: access
    mtu: 9100
    vlans: 67
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: c2m2-vxlan-lacp
    speed: "auto 25gfull"
    enabled: true
    mode: access
    mtu: 9100
    vlans: 67
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    port_channel:
      mode: active
      lacp_fallback:
        mode: "individual"
        individual:
          profile: c2m2-vxlan-lacp
    validate_state: false
    validate_lldp: false

  - profile: esxi-node-trunk
    speed: "50g-2"
    enabled: true
    mode: trunk
    mtu: 9100
    native_vlan: 67
    vlans: 67,100,993-999
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: vsan-node-trunk
    speed: "25g"
    enabled: true
    mode: trunk
    mtu: 9100
    native_vlan: 67
    vlans: 67,100,993-999
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    validate_state: false
    validate_lldp: false

  - profile: general-infrastruture-node-trunk
    speed: "auto 100g-4"
    enabled: true
    mode: trunk
    mtu: 9100
    native_vlan: 67
    vlans: 15,67,100
    spanning_tree_portfast: edge
    spanning_tree_bpdufilter: enabled
    spanning_tree_bpduguard: enabled
    flowcontrol:
      received: "on"
    port_channel:
      mode: active
      lacp_fallback:
        mode: "individual"
        individual:
          profile: general-infrastructure-node-trunk
    validate_state: false
    validate_lldp: false

network_ports:
  - switches:
      - p01l01a
    switch_ports:
      - Ethernet33
    profile: outbound
    description: "Fortinet"
  - switches:
      - p01l01a
      - p01l01b
    switch_ports:
      - Ethernet7/1
      - Ethernet7/2
      - Ethernet7/3
      - Ethernet7/4
      - Ethernet9/1
      - Ethernet9/2
      - Ethernet9/3
      - Ethernet9/4
    profile: vsan-node-trunk
    description: "VSAN"
  - switches:
      - p01l01a
      - p01l01b
    switch_ports:
      - Ethernet8/1
      - Ethernet8/3
      - Ethernet8/5
      - Ethernet8/7
      - Ethernet10/1
      - Ethernet10/3
      - Ethernet10/5
      - Ethernet10/7
    profile: esxi-node-trunk
    description: "esxi"
  - switches:
      - p01l01a
      - p01l01b
    switch_ports:
      - Ethernet17/1
      - Ethernet18/1
      - Ethernet19/1
      - Ethernet20/1
      - Ethernet21/1
      - Ethernet22/1
      - Ethernet23/1
      - Ethernet24/1
    profile: general-infrastruture-node-trunk
    description: "proxmox"
  - switches:
      - mp01l01
    switch_ports:
      - Ethernet1-48
    profile: mgmt-vxlan
    description: "Ilos"
  - switches: [d(1|4)(1|2)p(1|2|3|4)l12(a|b)]
    switch_ports: [Ethernet1-8/1]
    profile: unused
