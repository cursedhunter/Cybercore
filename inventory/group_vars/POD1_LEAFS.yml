---
l3leaf: # dynamic_key: node_type
  defaults:
    mgmt_ip: "{{ mgmt_ip }}"
    bgp_as: 651101-651105
    evpn_role: client
    evpn_route_servers:
      - p01l01a
      - p01l01b
    loopback_ipv4_pool: 10.0.12.0/24
    mlag_peer_ipv4_pool: 10.0.13.0/24
    mlag_peer_l3_ipv4_pool: 10.0.14.0/24
    mlag_interfaces:
      - Ethernet29/1
      - Ethernet30/1
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
    uplink_ipv4_pool: 10.0.101.0/23
    uplink_switches:
      - p01s01
      - p01s02
    virtual_router_mac_address: 00:1c:73:00:dc:01
    vtep_loopback_ipv4_pool: 10.0.102.0/24
  node_groups:
    - filter:
        tags:
          - OVERLAY_POD1_RACK1
          - OVERLAY_POD1_RACK2
      group: RACK1
      evpn_role: server
      nodes:
        - id: 1
          name: p01l01a
        - id: 2
          name: p01l01b
    - filter:
        tags:
          - OVERLAY_POD1_RACK3
      group: RACK3
      nodes:
        - id: 3
          name: p01l03
    - filter:
        tags:
          - OVERLAY_POD1_RACK4
          - OVERLAY_POD1_RACK5
      group: RACK4
      nodes:
        - id: 4
          name: p01l04
