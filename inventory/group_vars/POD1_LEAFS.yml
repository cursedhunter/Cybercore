---
l3leaf: # dynamic_key: node_type
  defaults:
    mgmt_ip: "{{ mgmt_ip }}"
    bgp_as: "{{ asn_hsn_pod1_leafs }}" # 651101-651105
    evpn_role: client
    loopback_ipv4_pool: "{{ hsn_pod1_leaf_loopback_ipv4_pool }}" # 10.0.12.0/24
    mlag_peer_ipv4_pool: "{{ hsn_pod1_leaf_mlag_peer_ipv4_pool }}" # 10.0.13.0/24
    mlag_peer_l3_ipv4_pool: "{{ hsn_pod1_leaf_mlag_peer_l3_ipv4_pool }}" # 10.0.14.0/24
    mlag_interfaces:
      - Ethernet29/1
      - Ethernet30/1
    spanning_tree_mode: mstp
    spanning_tree_priority: 16384
    uplink_ipv4_pool: "{{ hsn_pod1_leaf_uplink_ipv4_pool }}" # 10.0.101.0/23
    uplink_switches:
      - p01s01
      - p01s02
    virtual_router_mac_address: 00:1c:73:00:dc:01
    vtep_loopback_ipv4_pool: "{{ hsn_pod1_leaf_vtep_loopback_ipv4_pool }}" # 10.0.102.0/24
  node_groups:
    - filter:
        tags:
          - OVERLAY_POD1_RACK1
          - OVERLAY_POD1_RACK2
          - OVERLAY_C2M2_VXLAN
          - OVERLAY_POD1_NSX
          - OVERLAY_POD1_CEPH
          - OUTBOUND
      group: RACK1
      evpn_role: server
      platform: "7050DX4"
      nodes:
        - id: 1
          name: p01l01a
          # add default route to firewall redistribute in vrf..
          structured_config:
            static_routes:
              - vrf: IP_FABRIC
                prefix: 0.0.0.0/0
                next_hop: 10.70.1.39
            router_bgp:
              vrfs:
                - name: IP_FABRIC
                  redistribute:
                    static:
                      enabled: true
          uplink_switch_interfaces:
            - Ethernet1/1
            - Ethernet1/1
        - id: 2
          name: p01l01b
          uplink_switch_interfaces:
            - Ethernet2/1
            - Ethernet2/1
          structured_config:
            ethernet_interfaces:
              - name: Ethernet1-2/1
                speed: 100g-2
                error_correction_encoding:
                  enabled: true
                  reed_solomon: true
              - name: Ethernet1-2/3
                speed: 100g-2
                error_correction_encoding:
                  enabled: true
                  reed_solomon: true
    - filter:
        tags:
          - OVERLAY_POD1_RACK3
          - OVERLAY_C2M2_VXLAN
      group: RACK3
      platform: "7060CX2"
      evpn_route_servers:
        - p01l01a
        - p01l01b
      nodes:
        - id: 3
          name: p01l03
      uplink_switches:
        - p01s01
        - p01s01
        - p01s02
        - p01s02
      uplink_switch_interfaces:
        - Ethernet3/1
        - Ethernet4/1
        - Ethernet3/1
        - Ethernet4/1
      uplink_interfaces:
        - Ethernet29/1
        - Ethernet30/1
        - Ethernet31/1
        - Ethernet32/1
      uplink_interface_speed: "forced 100gfull"
    - filter:
        tags:
          - OVERLAY_POD1_RACK4
          - OVERLAY_POD1_RACK5
          - OVERLAY_C2M2_VXLAN
      group: RACK4
      platform: "7060CX2"
      evpn_route_servers:
        - p01l01a
        - p01l01b
      nodes:
        - id: 4
          name: p01l04
      uplink_switches:
        - p01s02
        - p01s02
      uplink_switch_interfaces:
        - Ethernet5/1
        - Ethernet6/1
      uplink_interfaces:
        - Ethernet31/1
        - Ethernet32/1
      uplink_interface_speed: "forced 100gfull"
