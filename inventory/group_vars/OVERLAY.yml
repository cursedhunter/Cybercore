---
evpn_vlan_aware_bundles: false
# overlay_rd_type:
#   admin_subfield: bgp_as
# overlay_rt_type:
#   admin_subfield: 1000

svi_profiles:
  - profile: mgmt_fabric_vxlan_profile
    vxlan: true
    enabled: true
    description: "MGMT IP FABRIC SVI, every rack"
    structured_config:
      no_autostate: true
    ip_helpers:
      - ip_helper: 10.65.6.110
    mtu: 9100
  - profile: c2m2_fabric_vxlan_profile
    vxlan: true
    enabled: true
    description: "C2M2 IP FABRIC SVI, every rack"
    structured_config:
      no_autostate: true
    ip_helpers:
      - ip_helper: 10.65.6.110
    mtu: 9100
  - profile: ip_fabric_svi_profile
    vxlan: false
    enabled: true
    description: "IP FABRIC SVI, per rack subnet"
    structured_config:
      no_autostate: true
    ip_helpers:
      - ip_helper: 10.65.6.110
    mtu: 9100

tenants: # dynamic_key: network_services
  - name: IP_FABRIC
    mac_vrf_vni_base: 30000
    vrfs:
      - name: IP_FABRIC
        vrf_vni: 10
        svis:
          - id: 15
            name: MGMT_VXLAN
            ip_address_virtual: "10.65.0.254/24"
            tags: [OVERLAY_MGMT_VXLAN]
            profile: mgmt_fabric_vxlan_profile
          - id: 67
            name: C2M2
            ip_address_virtual: "10.65.1.254/24"
            tags: [OVERLAY_C2M2_VXLAN]
            profile: c2m2_fabric_vxlan_profile
            nodes:
              - node: p01l04
                ip_address_virtual_secondaries:
                  - 10.65.4.254/24
          - id: 100
            name: VLAN100
            ip_address_virtual: "10.64.1.254/24"
            tags: [OVERLAY_POD1_RACK1]
            profile: ip_fabric_svi_profile
          - id: 102
            name: VLAN102
            ip_address_virtual: "10.64.2.254/24"
            tags: [OVERLAY_POD1_RACK2]
            profile: ip_fabric_svi_profile
          - id: 100
            name: VLAN100
            ip_address_virtual: "10.64.3.254/24"
            tags: [OVERLAY_POD1_RACK3]
            profile: ip_fabric_svi_profile
          - id: 100
            name: VLAN100
            ip_address_virtual: "10.64.4.254/24"
            tags: [OVERLAY_POD1_RACK4]
            profile: ip_fabric_svi_profile
          - id: 105
            name: VLAN105
            ip_address_virtual: "10.64.5.254/24"
            tags: [OVERLAY_POD1_RACK5]
            profile: ip_fabric_svi_profile
