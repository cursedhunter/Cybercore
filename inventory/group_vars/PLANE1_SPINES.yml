---

dc_name: PLANE1
pod_name: PLANE-1

spine: # dynamic_key: node_type
  defaults:
    p2p_uplinks_qos_profile: "PF_FABRIC_QUEUES_TD4"
    mgmt_ip: "{{ mgmt_ip }}"
    bgp_as: "{{ asn_hsn_plane1_spines }}" # 651116-651117
    loopback_ipv4_pool: "{{ hsn_plane1_spine_loopback_ipv4_pool }}" # 172.17.1.0/24
    platform: "7060"
    # uplink_ipv4_pool: "{{ hsn_plane1_spine_uplink_ipv4_pool }}" # 10.0.10.0/24
    max_parallel_uplinks: 4
  nodes:
    - id: 1
      name: p01s01
      structured_config:
        ethernet_interfaces:
          - name: Ethernet5/1
            speed: 100g-4
          - name: Ethernet6/1
            speed: 100g-4
    - id: 2
      name: p01s02
