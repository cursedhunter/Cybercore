---
containerlab_base_topology:
  name: cybercore

  mgmt:
    ipv4-subnet: 10.65.0.0/21
    ipv4-gw: 10.65.0.1
    bridge: br-cybercore

  topology:
    kinds:
      ceos:
        image: ${CEOS_IMAGE}
        env:
          MAX_SUPPORTED_FRAME_SIZE: ${MAX_SUPPORTED_FRAME_SIZE}
        binds:
          - cvp-token:/mnt/flash/token:ro
          - ceos/EthIntf.py:/usr/lib/python3.9/site-packages/EthIntf.py:ro
          - ceos/disable-offload:/mnt/flash/disable-offload:ro
          - ceos/rc.eos:/mnt/flash/rc.eos:ro
        healthcheck:
          test:
            - CMD-SHELL
            - ip netns exec ns-MGMT bash -c "echo > /dev/tcp/127.0.0.1/443"
        stages:
          healthy:
            exec:
              - command: echo "Healthy"
    nodes:
      reverse-proxy:
        image: ${NGINX_IMAGE}
        kind: linux
        binds:
          - nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
          - nginx/ssl:/etc/nginx/ssl:ro
        ports:
          - 443:443
        mgmt-ipv4: 10.65.0.2
        stages:
          configure:
            exec: # add all mgmt network gateways to br-mgmt
              - command: ip addr add 10.65.1.254/24 dev br-cybercore
                target: host
                phase: on-enter
