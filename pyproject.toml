[build-system]
requires = ["setuptools >= 64.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "clever_jones"
version = "0.0.0"
description = "clever_jones"
authors = [{ name = "Arista Networks" }]
readme = "README.md"
dependencies = [
    "pyavd[ansible]==6.4.0",
    "pre-commit~=4.2.0",
    "passlib~=1.7.4",
    ## Project depencencies
    "pyavd-cli",
    "doppel-tools @ git+ssh://git@github.com/arista-eosplus/doppel-tools@v0.0.20",
    "junitparser~=3.2.0",
    "natsort~=8.4.0",
    "jinja2-cli~=0.8.2",
    "certifi",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pip-tools"]

[tool.pip-tools.compile]
emit-find-links = false
strip-extras = true
emit-index-url = false
header = false
