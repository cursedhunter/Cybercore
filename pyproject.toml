[build-system]
requires = ["setuptools >= 64.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "clever_jones"
version = "0.0.0"
description = "clever_jones"
authors = [{ name = "Arista Networks", email = "eosplus-dev@arista.com" }]
readme = "README.md"
dependencies = [
    "pyavd[ansible]==5.2.2",
    "pre-commit~=3.8.0",
    "ansible-lint~=25.1.3 ; platform_system != 'Windows'",
    ## Project depencencies
    "anta @ git+https://github.com/dlobato/anta.git@blue",
    "pyavd-cli~=0.1.4",
    "doppel-tools @ git+ssh://git@github.com/arista-eosplus/doppel-tools@v0.0.17",
    "junitparser==3.1.2",
    "jinja2-cli~=0.8.2",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pip-tools"]

[tool.pip-tools.compile]
emit-find-links = false
strip-extras = true
