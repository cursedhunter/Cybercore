---
include: ".gitlab/common-ci.yml"

check-ci-variables:
  stage: test
  needs:
    - job: set-runtime-env-image-tag
      optional: true
  script:
    - scripts/check_ci_variable.sh ANTA_USERNAME "Missing CI variable \$ANTA_USERNAME, please check README.md"
    - scripts/check_ci_variable.sh ANTA_PASSWORD "Missing CI variable \$ANTA_PASSWORD, please check README.md"
    - scripts/check_ci_variable.sh CLAB_HOSTS "Missing CI variable \$CLAB_HOSTS, please check README.md"
    - scripts/check_ci_variable.sh CLAB_ENV "Missing CI variable \$CLAB_ENV, please check README.md"
    - scripts/check_ci_variable.sh CV_DEPLOY_SERVER "Missing CI variable \$CV_DEPLOY_SERVER, please check README.md"
    - scripts/check_ci_variable.sh CV_DEPLOY_TOKEN "Missing CI variable \$CV_DEPLOY_TOKEN, please check README.md"
    - scripts/check_ci_variable.sh TELEMETRY_PRODUCTION_SERVERS "Missing CI variable \$TELEMETRY_PRODUCTION_SERVERS, please check README.md"
    - scripts/check_ci_variable.sh SSH_CONFIG "Missing CI variable \$SSH_CONFIG, please check README.md"
    - scripts/check_ci_variable.sh SSH_USER "Missing CI variable \$SSH_USER, please check README.md"
    - scripts/check_ci_variable.sh SSH_PRIVATE_KEY "Missing CI variable \$SSH_PRIVATE_KEY, please check README.md"

check-hosts-ssh:
  stage: test
  extends: .remote_ssh_job
  needs:
    - job: set-runtime-env-image-tag
      optional: true
    - check-ci-variables
  script:
    - cut -d "," -f1 < $CLAB_HOSTS | xargs -I{} scripts/check_ssh_connection.sh $SSH_USER {} 2>&1 | tr -d '\r'

check-host-requirements:
  stage: test
  extends: .remote_ssh_job
  needs:
    - job: set-runtime-env-image-tag
      optional: true
    - check-hosts-ssh
  script:
    - cut -d "," -f1 < $CLAB_HOSTS | xargs -I{} scripts/check_required_tools.sh $SSH_USER {} 2>&1 | tr -d '\r'

discover-mtu:
  stage: test
  extends: .remote_ssh_job
  needs:
    - job: set-runtime-env-image-tag
      optional: true
    - check-hosts-ssh
  script:
    - CLAB_HOST_NAMES=$(cut -d "," -f1 < $CLAB_HOSTS)
    - echo "$CLAB_HOST_NAMES" | xargs -I{} scripts/set_maxmtu.sh $SSH_USER {} $CLAB_HOST_INTERFACE 2>&1 | tr -d '\r'
    - FROM_HOST=$(echo "$CLAB_HOST_NAMES" | head -n 1)
    - TO_HOSTS=$(echo "$CLAB_HOST_NAMES" | tail -n +2)
    - MAX_DISCOVERED_MTU=$(ssh -T "$SSH_USER@$FROM_HOST" python - --source-interface $CLAB_HOST_INTERFACE --max-mtu 10000 $TO_HOSTS < scripts/mtu_discovery.py)
    - echo "Discovered mac MTU between hosts $MAX_DISCOVERED_MTU"
    - |
      if [[ "$MAX_MTU_BETWEEN_CLAB_HOSTS" -gt "$MAX_DISCOVERED_MTU" ]]; then
        echo "MAX_MTU_BETWEEN_CLAB_HOSTS($MAX_MTU_BETWEEN_CLAB_HOSTS) is greater than discovered max MTU between hosts ($MAX_DISCOVERED_MTU)"
        exit 1
      fi
      # DIGITAL_TWIN_MAX_SUPPORTED_MTU + VXLAN_OVERHEAD(50) + ETH_FCS_LEN(4) + VLAN_ETH_HLEN(18)
      NEEDS_MTU=$(($DIGITAL_TWIN_MAX_SUPPORTED_MTU + 72))
      if [[ "$NEEDS_MTU" -gt "$MAX_DISCOVERED_MTU" ]]; then
        echo "DIGITAL_TWIN_MAX_SUPPORTED_MTU + overhead ($NEEDS_MTU) is greated than discovered max MTU between hosts ($MAX_DISCOVERED_MTU)"
        exit 1
      fi
