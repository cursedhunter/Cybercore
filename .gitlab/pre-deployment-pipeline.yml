---
include: ".gitlab/common-ci.yml"

.pre-deployment-nrfu_job:
  rules:
    - if: $CI_COMMIT_TITLE !~ /\[skip-nrfu\]/i && $SKIP_PRE_DEPLOYMENT_NRFU == "No"

pre-commit:
  stage: lint
  script:
    - pre-commit run --all-files --show-diff-on-failure

build-fabric-digital-twin:
  stage: build
  extends: [.build-fabric, .pre-deployment-nrfu_job]
  variables:
    TELEMETRY_SERVERS: $TELEMETRY_DIGITAL_TWIN_SERVERS
    TELEMETRY_TOKEN_PATH: /mnt/flash/token
    MAX_SUPPORTED_MTU: $DIGITAL_TWIN_MAX_SUPPORTED_MTU

build-fabric-production:
  stage: build
  extends: .build-fabric
  variables:
    TELEMETRY_SERVERS: $TELEMETRY_PRODUCTION_SERVERS

generate-clab-topology:
  stage: build
  extends: .pre-deployment-nrfu_job
  needs:
    - job: set-runtime-env-image-tag
      optional: true
    - build-fabric-digital-twin
  script:
    # CLAB_HOSTS_INTERNAL is useful needed if utilizing CLAB_HOSTS behind NAT. CLAB_HOSTS is the
    # external IP, CLAB_HOSTS_INTERNAL is the private NAT IP. This was necessary when using cloud hosted clab hosts
    # in an AWS VPC behind an IGW. The CLAB_HOSTS will connect directly with each other inside of VPC utilizing
    # the CLAB_HOSTS_INTERNAL IP's, while the gitlab pipeline runner can/may use the external IPs in CLAB_HOSTS.
    - if [[ -f "$CLAB_HOSTS_INTERNAL" ]]; then CLAB_HOSTS_PATH=$CLAB_HOSTS_INTERNAL; else CLAB_HOSTS_PATH=$CLAB_HOSTS; fi
    - CLAB_HOST_NAMES=$(cut -d "," -f1 < $CLAB_HOSTS_PATH)
    - split-topology -i $INVENTORY_PATH/inventory.yml --limit $FABRIC_INVENTORY_GROUP --strategy $TOPOLOGY_SPLIT_STRATEGY -o host_mapping.yml $CLAB_HOST_NAMES
    - generate-clab-topology -i $INVENTORY_PATH/inventory.yml --limit $FABRIC_INVENTORY_GROUP -m host_mapping.yml -c tools_config.yml -v
  artifacts:
    paths:
      - clab
      - host_mapping.yml

digital-twin-distribute:
  stage: deploy
  extends: [.pre-deployment-nrfu_job, .remote_ssh_job]
  needs:
    - job: set-runtime-env-image-tag
      optional: true
    - build-fabric-digital-twin
    - generate-clab-topology
  script:
    - cp -r $INVENTORY_PATH/intended/configs clab/configs
    - if [[ -f $TELEMETRY_DIGITAL_TWIN_ONBOARDING_TOKEN ]]; then cp $TELEMETRY_DIGITAL_TWIN_ONBOARDING_TOKEN clab/cvp-token; fi
    - if [[ -f $CLAB_ENV ]]; then cp $CLAB_ENV clab/clab.env; fi
    - cp $CLAB_HOSTS clab/clab_hosts.csv
    - cd clab && tar -czf ../mclab.tgz * && cd -
    - yq '.[] | key' host_mapping.yml | xargs -I{} scripts/distribute.sh $SSH_USER {} mclab.tgz mclab-$CI_COMMIT_SHA 2>&1 | tr -d '\r'
  artifacts:
    paths:
      - mclab.tgz

digital-twin-generate-pipeline:
  stage: deploy
  extends: .pre-deployment-nrfu_job
  needs:
    - job: set-runtime-env-image-tag
      optional: true
    - generate-clab-topology
  script:
    - |
      yq '{"host_mapping": .}' host_mapping.yml > host_mapping_data.yml
    - jinja2 --strict -D nrfu_start_in_min=${WAIT_READINESS_DURATION_MINUTES} .gitlab/digital-twin-nrfu-ci.yml.jinja2 < host_mapping_data.yml >> digital-twin-nrfu-child-pipeline.yml
  artifacts:
    paths:
      - digital-twin-nrfu-child-pipeline.yml

digital-twin-deploy-and-nrfu:
  stage: deploy
  extends: .pre-deployment-nrfu_job
  needs:
    - job: set-runtime-env-image-tag
      optional: true
    - digital-twin-distribute
    - digital-twin-generate-pipeline
  resource_group: digital-twin
  trigger:
    include:
      - artifact: digital-twin-nrfu-child-pipeline.yml
        job: digital-twin-generate-pipeline
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID

cv-validate:
  stage: deploy
  needs:
    - job: set-runtime-env-image-tag
      optional: true
    - build-fabric-production
  environment:
    name: pre-deployment/$CI_COMMIT_REF_SLUG
    url: $CV_WORKSPACE_URL
    on_stop: stop-validate-workspace
  script:
    - ansible-playbook -v -i $INVENTORY_PATH/inventory.yml playbooks/cv_validate.yml
    - echo "To review the changes visit $CV_WORKSPACE_URL"
  variables:
    WORKSPACE_ID: pre-deployment-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID
    WORKSPACE_NAME: pre-deployment-$CI_PROJECT_NAME-$CI_COMMIT_REF_NAME
    WORKSPACE_DESCRIPTION: "DO NOT SUBMIT. Changes authored by $CI_COMMIT_AUTHOR in commit $COMMIT_URL"
    CV_WORKSPACE_URL: https://$CV_DEPLOY_SERVER/cv/provisioning/workspaces?ws=$WORKSPACE_ID
    COMMIT_URL: "$CI_PROJECT_URL/-/commits/$CI_COMMIT_SHORT_SHA"

stop-validate-workspace:
  stage: .post
  allow_failure: true
  environment:
    name: pre-deployment/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    - python scripts/delete_cv_workspace.py --cv-server $CV_DEPLOY_SERVER --cv-token $CV_DEPLOY_TOKEN --no-cv-verify-certs $WORKSPACE_ID
  variables:
    WORKSPACE_ID: pre-deployment-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID
  when: manual
