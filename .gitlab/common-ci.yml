## A remote ssh job can extend from this hidden_job
.remote_ssh_job:
  before_script:
    - eval $(ssh-agent -s)
    - base64 -d < $SSH_PRIVATE_KEY | tr -d '\r' | ssh-add -
    - ssh-add -L
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - if [ -f "$CLAB_KNOWN_HOSTS" ]; then cp "$CLAB_KNOWN_HOSTS" ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts; fi
    - if [ -f "$SSH_CONFIG" ]; then cp "$SSH_CONFIG" ~/.ssh/config && chmod 600 ~/.ssh/config; fi

.build-fabric:
  script:
    - |
      if [[ "${AVD_BUILD_ENGINE}" == "pyavd" ]]; then
        pyavd-build -i ${INVENTORY_PATH}/inventory.yml -o ${INVENTORY_PATH}/intended -f ${FABRIC_INVENTORY_GROUP} -v
      else
        ansible-playbook playbooks/build-skip-docs.yml -i ${INVENTORY_PATH}/inventory.yml
      fi
  artifacts:
    paths:
      - ${INVENTORY_PATH}/intended
